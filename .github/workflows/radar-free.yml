name: Radar Médico — FREE ONLY

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 10,16,22 * * *"

permissions:
  contents: write

jobs:
  radar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run regression tests
        run: python -m unittest discover -s collector/tests -v

      - name: Ensure operational release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view radar-data >/dev/null 2>&1; then
            gh release create radar-data               --title "Radar Médico — dados operacionais"               --notes "Assets atualizados automaticamente pelo workflow FREE-ONLY."               --target "${GITHUB_SHA}"
          fi

      - name: Restore previous state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime
          gh release download radar-data --pattern "opportunities.json" --dir runtime || true
          gh release download radar-data --pattern "residencies.json" --dir runtime || true
          gh release download radar-data --pattern "state.json" --dir runtime || true
          if [ ! -f runtime/opportunities.json ]; then
            printf '{"updatedAt":null,"items":[]}
' > runtime/opportunities.json
          fi
          if [ ! -f runtime/residencies.json ]; then
            printf '{"updatedAt":null,"items":[]}
' > runtime/residencies.json
          fi
          if [ ! -f runtime/state.json ]; then
            printf '{"updatedAt":null}
' > runtime/state.json
          fi

      - name: Collect and normalize
        env:
          PYTHONPATH: .
        run: python -m collector.src.runtime --runtime runtime

      - name: Send optional free Gmail alert
        env:
          RADAR_RUNTIME: runtime
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m collector.src.notify

      - name: Publish operational assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload radar-data runtime/opportunities.json --clobber
          gh release upload radar-data runtime/residencies.json --clobber
          gh release upload radar-data runtime/residency-source-health.json --clobber
          gh release upload radar-data runtime/changes.json --clobber
          gh release upload radar-data runtime/state.json --clobber

      - name: Free-only guard
        run: |
          echo "FREE_ONLY=1"
          echo "Coleta, persistência e execução concluídas sem serviço pago."
