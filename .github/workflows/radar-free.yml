name: Radar Medico Free

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 10,16,22 * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test collector
        run: |
          python -m unittest discover -s collector/tests -v
          python -m compileall -q collector

      - name: Ensure data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view radar-data >/dev/null 2>&1; then
            gh release create radar-data --title "Radar Medico - dados operacionais" --notes "Dados atualizados automaticamente." --target "$GITHUB_SHA"
          fi

      - name: Restore previous state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime
          gh release download radar-data --pattern "opportunities.json" --dir runtime || true
          gh release download radar-data --pattern "residencies.json" --dir runtime || true
          gh release download radar-data --pattern "state.json" --dir runtime || true
          gh release download radar-data --pattern "my-radar.json" --dir runtime || true
          test -f runtime/opportunities.json || echo '{"updatedAt":null,"items":[]}' > runtime/opportunities.json
          test -f runtime/residencies.json || echo '{"updatedAt":null,"items":[]}' > runtime/residencies.json
          test -f runtime/state.json || echo '{"updatedAt":null}' > runtime/state.json
          test -f runtime/my-radar.json || cp collector/config/my_radar.json runtime/my-radar.json

      - name: Collect data
        env:
          PYTHONPATH: .
        run: python -m collector.src.runtime --runtime runtime

      - name: Optional email alert
        env:
          RADAR_RUNTIME: runtime
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RADAR_PROFILE_PATH: runtime/my-radar.json
        run: python -m collector.src.notify

      - name: Publish data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload radar-data runtime/opportunities.json --clobber
          gh release upload radar-data runtime/contest-source-health.json --clobber
          gh release upload radar-data runtime/residencies.json --clobber
          gh release upload radar-data runtime/residency-source-health.json --clobber
          gh release upload radar-data runtime/changes.json --clobber
          gh release upload radar-data runtime/state.json --clobber

      - name: Free only
        run: echo "FREE_ONLY=1"
